map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	server_name _;
	client_max_body_size 2m;
	resolver 127.0.0.11 valid=5s ipv6=off;
	set $web_upstream http://frontend:5173;
	set $api_upstream http://api:5174;

	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Request-Id $request_id;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;

	location /v1/ {
		proxy_pass $api_upstream;
	}
	location = /v1 {
		default_type application/json;
		return 404 '{"status":"error","responseCode":404,"error":{"code":"NOT_FOUND","message":"The requested API resource was not found.","details":[]}}';
	}

	location / {
		proxy_pass $web_upstream;
	}

	error_page 502 = @bad_gateway;
	error_page 503 = @service_unavailable;
	error_page 504 = @gateway_timeout;
	error_page 413 = @payload_too_large;

	location @payload_too_large {
		default_type application/json;
		return 413 '{"status":"error","responseCode":413,"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request payload is too large.","details":[]}}';
	}

	location @bad_gateway {
		default_type application/json;
		return 502 '{"status":"error","responseCode":502,"error":{"code":"BAD_GATEWAY","message":"The upstream service is unavailable.","details":[]}}';
	}

	location @service_unavailable {
		default_type application/json;
		return 503 '{"status":"error","responseCode":503,"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable.","details":[]}}';
	}

	location @gateway_timeout {
		default_type application/json;
		return 504 '{"status":"error","responseCode":504,"error":{"code":"GATEWAY_TIMEOUT","message":"The upstream service timed out.","details":[]}}';
	}
}
