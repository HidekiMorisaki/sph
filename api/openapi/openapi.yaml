openapi: 3.1.0
info:
  title: SME Portal Hub REST API
  version: 1.0.0
  description: Version 1 API for equipment and employee management.
servers:
  - url: http://localhost:3000
    description: Local gateway
tags:
  - name: Health
  - name: Authentication
  - name: Settings
  - name: Employees
  - name: Roles
  - name: Employee masters
  - name: Assets
  - name: Locations
  - name: Work calendars
  - name: System settings
paths:
  /v1/employee-analytics:
    get:
      tags: [Employees]
      operationId: getEmployeeAnalytics
      description: |
        Available to every authenticated role, including general users.
        Returns aggregate counts only, using non-deleted employee records.
        Business reference date defaults to today in Asia/Tokyo. Optional referenceDate
        is a real YYYY-MM-DD date on or before today, with no duplicates.
        Employees are active from hiredAt
        through the day before retiredAt. Optional fromMonth and toMonth must
        be supplied together in YYYY-MM format, without duplicates, in ascending
        order and no later than the reference month. The reference month
        ends on the reference date. With a period, demographics count employees
        active for at least one day in it, and ages use its end date. Each annual
        row covers the intersection of the selected period with that year.
        Headcounts use each row's end date; turnover is departures in that row
        divided by headcount at its start date times 100 (null for zero denominator).
        Summary cards always describe headcount at the reference date and the
        reference year's January 1 through that date,
        independent of the selected period. Without a period, demographics use
        employees active at the reference date and annual rows cover at most
        the latest 10 years up to the reference year.
        Historical values use current employment dates, excluding deleted and
        previous employment records. Responses never include individual employees.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: referenceDate
          in: query
          schema: { type: string, format: date, pattern: '^(?!0000)\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
        - name: fromMonth
          in: query
          schema: { type: string, pattern: '^(?!0000)\d{4}-(0[1-9]|1[0-2])$' }
        - name: toMonth
          in: query
          schema: { type: string, pattern: '^(?!0000)\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Employee analytics (private, no-store)
          content:
            application/json:
              schema:
                type: object
                required: [status, responseCode, data]
                properties:
                  status: { type: string, const: success }
                  responseCode: { type: integer, const: 200 }
                  data: { $ref: '#/components/schemas/EmployeeAnalytics' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      description: Public liveness information, including the running product version.
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /v1/system-information:
    get:
      tags: [System settings]
      operationId: getSystemInformation
      description: System administrator only. Returns read-only release information with language-independent message IDs for the running system.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                type: object
                required: [status, responseCode, data]
                properties:
                  status: { type: string, const: success }
                  responseCode: { type: integer, const: 200 }
                  data: { $ref: '#/components/schemas/SystemInformation' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/work-calendars:
    get:
      tags: [Work calendars]
      operationId: listWorkCalendars
      description: Available to every authenticated role.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [id, code, name, createdAt, updatedAt], default: name } }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Work calendars]
      operationId: createWorkCalendar
      description: System administrator only.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/WorkCalendarWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/work-calendars/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Work calendars]
      operationId: getWorkCalendar
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Work calendars]
      operationId: updateWorkCalendar
      description: System administrator only.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/WorkCalendarWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Work calendars]
      operationId: deleteWorkCalendar
      description: System administrator only. Soft-deletes the calendar and its entries, and clears employee assignments.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/work-calendars/{id}/entries:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Work calendars]
      operationId: listWorkCalendarEntries
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: sortBy, in: query, schema: { type: string, enum: [workDate, entryType, title, createdAt, updatedAt], default: workDate } }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Work calendars]
      operationId: createWorkCalendarEntry
      description: System administrator only.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/WorkCalendarEntryWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/work-calendars/{id}/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: entryId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    patch:
      tags: [Work calendars]
      operationId: updateWorkCalendarEntry
      description: System administrator only.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/WorkCalendarEntryWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Work calendars]
      operationId: deleteWorkCalendarEntry
      description: System administrator only; performs a soft delete.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/calendar-date-attributes:
    get:
      tags: [Work calendars]
      operationId: listCalendarDateAttributes
      description: Returns stored weekend and public-holiday attributes from 2011 onward. Available to every authenticated role.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: from, in: query, required: true, schema: { type: string, format: date, minimum: '2011-01-01' } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: sortBy, in: query, schema: { type: string, enum: [calendarDate, kind, name], default: calendarDate } }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/calendar-holiday-imports:
    get:
      tags: [Work calendars]
      operationId: listCalendarHolidayImports
      description: Available to every authenticated role.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: sortBy, in: query, schema: { type: string, enum: [completedAt, status, createdAt], default: completedAt } }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Work calendars]
      operationId: importCalendarHolidays
      description: System administrator only. Imports Cabinet Office public holidays for the year of the specified active work calendar and keeps existing data when the source fails. Calendars in the same year share public-holiday data.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/CalendarHolidayImportWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/work-calendars/{id}/employees:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Work calendars]
      operationId: listWorkCalendarEmployees
      description: Available to every authenticated role.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: sortBy, in: query, schema: { type: string, enum: [employee, employeeCode], default: employee } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Work calendars]
      operationId: replaceWorkCalendarEmployees
      description: System administrator only. Each employee is assigned to at most one work calendar.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/WorkCalendarEmployeesWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/external-links:
    get:
      tags: [System settings]
      operationId: listExternalLinks
      description: Returns active external links for every authenticated role.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: q, in: query, schema: { type: string, maxLength: 255 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [name, url, sortOrder, createdAt, updatedAt], default: sortOrder } }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [System settings]
      operationId: createExternalLink
      description: System administrator only. Restores a soft-deleted link when its name is reused.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/ExternalLinkWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/external-links/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [System settings]
      operationId: updateExternalLink
      description: System administrator only.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/ExternalLinkWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [System settings]
      operationId: deleteExternalLink
      description: System administrator only; performs a soft delete.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      description: Returns the authenticated employee with separate firstName, middleName, and lastName fields. No preformatted name field is returned.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/auth/password:
    patch:
      tags: [Authentication]
      operationId: changePassword
      description: Changes the authenticated employee's password, soft-deletes every active session for that employee, and clears the current session cookie.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmation]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 1024
                  description: Must include at least one uppercase ASCII letter, one lowercase ASCII letter, and one digit, and must differ from the current password.
                confirmation: { type: string, maxLength: 1024, description: Must exactly match newPassword. }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/settings:
    get:
      tags: [Settings]
      operationId: getPersonalSettings
      description: Returns localization settings for the authenticated employee. Defaults are returned when the employee has not saved settings yet.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Settings]
      operationId: updatePersonalSettings
      description: Creates, updates, or restores localization settings for the authenticated employee.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeZone, displayLanguage]
              properties:
                timeZone: { type: string, minLength: 1, maxLength: 64, description: Valid IANA time-zone identifier. }
                displayLanguage: { $ref: '#/components/schemas/DisplayLanguage' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/settings/employee-analysis:
    get:
      tags: [Settings]
      operationId: getEmployeeAnalysisSelection
      description: All authenticated roles can retrieve their own saved reference date and independent chart periods. Returns data.employeeId, data.today (Tokyo calendar date), and data.selection (null before first save or when stored selections are invalid). Responses are private and not cached.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Settings]
      operationId: updateEmployeeAnalysisSelection
      description: Saves a complete selection for the session employee only, without changing localization settings. A matching owner header prevents a queued write from a previous login being applied to another employee. Reference date must be valid and on or before today; chart periods must be ordered and end on or before the reference month. Requires normal session and same-origin protections.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: x-settings-owner
          in: header
          required: true
          schema: { type: integer }
          description: Employee ID returned by GET. Used only to verify session continuity; cannot select a target employee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [referenceDate, charts]
              properties:
                referenceDate: { type: string, format: date }
                charts:
                  type: object
                  additionalProperties: false
                  required: [age, gender, trend, turnover]
                  properties:
                    age: &analysisPeriod
                      type: object
                      additionalProperties: false
                      required: [fromMonth, toMonth]
                      properties:
                        fromMonth: { type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$' }
                        toMonth: { type: string, pattern: '^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])$' }
                    gender: *analysisPeriod
                    trend: *analysisPeriod
                    turnover: *analysisPeriod
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/employees/me:
    get:
      tags: [Employees]
      operationId: getMyProfile
      description: Returns the authenticated employee's self-editable profile fields.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Employees]
      operationId: updateMyProfile
      description: Updates only the authenticated employee's permitted personal and contact fields.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/EmployeeValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/EmployeeConflict' }
  /v1/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      description: Employee representations include request-time derived `age`, `lengthOfService`, and `employmentStatus` values. Current employees are returned by default; retired and soft-deleted employees can be included independently.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - name: includeRetired
          in: query
          description: Include non-deleted employees whose retirement date is on or before the API calculation date.
          schema: { type: boolean, default: false }
        - name: includeDeleted
          in: query
          description: Include soft-deleted employees regardless of their retirement date.
          schema: { type: boolean, default: false }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, employee, employeeCode, firstName, lastName, age, lengthOfService, department, group, position, employmentType, branch, roles, hiredAt, createdAt, updatedAt]
            default: employeeCode
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employees]
      operationId: createEmployee
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/EmployeeValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/EmployeeConflict' }
  /v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Employees]
      operationId: updateEmployee
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/EmployeeWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/EmployeeValidationError' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/EmployeeConflict' }
    delete:
      tags: [Employees]
      operationId: deleteEmployee
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      description: Lists active assignable roles. System-management role changes require a system administrator; administrators without system-management permission may assign only roles that also lack system-management permission.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - name: sortBy
          in: query
          schema: { type: string, enum: [name], default: name }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Roles]
      operationId: updateRoleName
      description: System administrator only. Updates the role name, which is the role natural key. Permission identifiers and assignments are not exposed or editable through this endpoint.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/RoleNameWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/{master}:
    parameters:
      - $ref: '#/components/parameters/Master'
    get:
      tags: [Employee masters]
      operationId: listEmployeeMaster
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - name: sortBy
          in: query
          description: Allowed values depend on the selected master. Employee groups additionally allow department. All master resources allow sortOrder and use it as the default. Branches additionally allow openedOn and closedOn.
          schema:
            type: string
            enum: [id, department, name, openedOn, closedOn, displayName, managementCodePrefix, vendor, product, version, officialUrl, disposalDatePolicy, sortOrder, createdAt, updatedAt]
      responses:
        '200': { $ref: '#/components/responses/MasterListSuccess' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Employee masters]
      operationId: createEmployeeMaster
      description: All employee, location branch, and IT asset masters accept a non-negative integer sortOrder and default it to 9999 when omitted. Employee groups require name and departmentId. For branches, the request follows BranchWrite. A branch created with closedOn is immediately soft-deleted and omitted from active lists.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/{master}/{id}:
    parameters:
      - $ref: '#/components/parameters/Master'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Employee masters]
      operationId: updateEmployeeMaster
      description: All sortable employee, location branch, and IT asset masters accept a non-negative integer sortOrder. Omitting it preserves the existing value for employee and location branch masters and uses 9999 for IT asset masters. Employee groups require name and departmentId; changing the department is rejected when it conflicts with assigned employees. For branches, the request follows BranchWrite. Setting closedOn soft-deletes the branch using the same database transaction time for updatedAt and deletedAt. A referenced branch cannot be closed.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Employee masters]
      operationId: deleteEmployeeMaster
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/storage:
    get:
      tags: [Locations]
      operationId: listStorage
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, branch, room, sortOrder, notes, createdAt, updatedAt]
            default: sortOrder
      responses:
        '200': { $ref: '#/components/responses/MasterListSuccess' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Locations]
      operationId: createStorage
      description: Accepts an optional non-negative integer sortOrder and defaults it to 9999 when omitted.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/storage/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Locations]
      operationId: updateStorage
      description: Accepts an optional non-negative integer sortOrder. Omitting it preserves the existing value.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Locations]
      operationId: deleteStorage
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/rooms:
    get:
      tags: [Locations]
      operationId: listRooms
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, branch, sortOrder, notes, createdAt, updatedAt]
            default: sortOrder
      responses:
        '200': { $ref: '#/components/responses/MasterListSuccess' }
    post:
      tags: [Locations]
      operationId: createRoom
      description: Accepts an optional non-negative integer sortOrder and defaults it to 9999 when omitted.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Locations]
      operationId: updateRoom
      description: Accepts an optional non-negative integer sortOrder. Omitting it preserves the existing value.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/JsonResource' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Locations]
      operationId: deleteRoom
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/it-asset-code-previews:
    get:
      tags: [Assets]
      operationId: previewItAssetManagementCode
      description: Returns the next available three-digit management code candidate. The candidate is not reserved until an IT asset is saved.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: typeId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ItAssetValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/it-assets:
    get:
      tags: [Assets]
      operationId: listItAssets
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, assetTag, type, manufacturer, modelNumber, serialNumber, branch, room, storage, user, status, ramGb, purchasedOn, disposalOn, createdAt, updatedAt]
            default: assetTag
        - name: q
          in: query
          schema: { type: string }
        - name: typeId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: manufacturerId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: statusId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: storageId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/ListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [Assets]
      operationId: createItAsset
      description: Creates an IT asset. Omit assetTag or send null to allocate the next available three-digit code; a supplied code must use the selected type prefix and exactly three digits.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/ItAssetWrite' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ItAssetValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ItAssetConflict' }
  /v1/it-assets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assets]
      operationId: getItAsset
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Assets]
      operationId: updateItAsset
      description: Updates an IT asset. Omit assetTag or send null to preserve it for the same type or allocate a three-digit code after a type change. A supplied new code must use the selected type prefix and exactly three digits. An unchanged legacy four-digit code remains valid.
      security: [{ sessionCookie: [] }]
      requestBody: { $ref: '#/components/requestBodies/ItAssetWrite' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/ItAssetValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ItAssetConflict' }
    delete:
      tags: [Assets]
      operationId: deleteItAsset
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/it-assets/{id}/credentials:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assets]
      operationId: getItAssetCredentialStatus
      description: System and server administrators only. Returns configured/not-configured status; no password material is returned.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/it-assets/{id}/credentials/{credentialType}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: credentialType
        in: path
        required: true
        schema: { type: string, enum: [admin, login, management_console] }
    put:
      tags: [Assets]
      operationId: setItAssetCredential
      description: System and server administrators only. Encrypts and replaces an asset password; the password is never returned by this endpoint.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Assets]
      operationId: clearItAssetCredential
      description: System and server administrators only. Logically deletes the selected asset credential.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/it-assets/{id}/credential-accesses:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Assets]
      operationId: revealItAssetCredential
      description: System and server administrators only. Reauthenticates the current user and returns one asset password in a no-store response. Every successful reveal is audited.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentialType, currentPassword]
              properties:
                credentialType: { type: string, enum: [admin, login, management_console] }
                currentPassword: { type: string, maxLength: 1024, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/it-assets/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assets]
      operationId: listItAssetAssignments
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Assets]
      operationId: assignItAsset
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: integer, minimum: 1, description: Employee receiving the IT asset. }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/it-assets/{id}/assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: assignmentId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Assets]
      operationId: returnItAsset
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: equipment_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Master:
      name: master
      in: path
      required: true
      schema:
        type: string
        enum: [departments, employee-groups, positions, employment-types, branches, it-asset-types, manufacturers, cpu-types, operating-systems, it-asset-statuses]
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      description: Values outside 1 through 500, including zero, are rejected.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    SortOrder:
      name: sortOrder
      in: query
      description: Case-insensitive sort direction. Responses normalize the value to lowercase.
      schema: { type: string, enum: [asc, desc, ASC, DESC], default: asc }
  requestBodies:
    WorkCalendarWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkCalendarWrite' }
    WorkCalendarEntryWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkCalendarEntryWrite' }
    WorkCalendarEmployeesWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [employeeIds]
            properties:
              employeeIds:
                type: array
                uniqueItems: true
                items: { $ref: '#/components/schemas/PositiveIdInput' }
    CalendarHolidayImportWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workCalendarId]
            properties:
              workCalendarId: { $ref: '#/components/schemas/PositiveIdInput' }
    ExternalLinkWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ExternalLinkWrite' }
    RoleNameWrite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleNameWrite' }
    EmployeeWrite:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EmployeeWrite'
    ItAssetWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ItAssetWrite'
    JsonResource:
      required: true
      content:
        application/json:
          schema: { type: object }
  responses:
    Success:
      description: Successful request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Created:
      description: Resource created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    ListSuccess:
      description: Successful paginated list
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ListEnvelope' }
    MasterListSuccess:
      description: Successful paginated master-data list. Every item includes the number of active direct references in usageCount.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ListEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MasterListItem' }
    Error:
      description: API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    EmployeeValidationError:
      description: Employee input validation failed. `error.details` identifies each invalid field and its reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    EmployeeConflict:
      description: Employee code or email is already in use, or another employee update conflict occurred. Field conflicts use `EMPLOYEE_FIELD_CONFLICT` and identify the field in `error.details`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ItAssetValidationError:
      description: IT asset input validation failed. The response uses `VALIDATION_ERROR`, and `error.details` identifies each invalid field and its reason.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            requiredFields:
              value:
                status: error
                responseCode: 400
                error:
                  code: VALIDATION_ERROR
                  message: One or more fields are invalid.
                  details:
                    - { field: assetTag, reason: Management code must use the selected type prefix. }
                    - { field: typeId, reason: Select an option. }
    ItAssetConflict:
      description: Management code or the manufacturer and serial-number combination is already in use. The response uses `IT_ASSET_FIELD_CONFLICT`, and `error.details` identifies `assetTag` or `serialNumber`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            assetTag:
              value:
                status: error
                responseCode: 409
                error:
                  code: IT_ASSET_FIELD_CONFLICT
                  message: An IT asset already uses this value.
                  details:
                    - { field: assetTag, reason: This management code is already in use. }
            manufacturerAndSerialNumber:
              value:
                status: error
                responseCode: 409
                error:
                  code: IT_ASSET_FIELD_CONFLICT
                  message: An IT asset already uses this value.
                  details:
                    - { field: serialNumber, reason: This manufacturer and serial number combination is already in use. }
  schemas:
    EmployeeAnalytics:
      type: object
      required: [referenceDate, fromYear, period, demographicTotal, summary, ageGroups, genders, annual]
      properties:
        referenceDate: { type: string, format: date }
        fromYear: { type: integer }
        demographicTotal: { type: integer, minimum: 0, description: Number of distinct employees in the age and gender population. }
        period:
          type: [object, 'null']
          required: [fromMonth, toMonth, startDate, endDate]
          properties:
            fromMonth: { type: string }
            toMonth: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
        summary:
          type: object
          required: [headcount, hires, departures, turnoverRate]
          properties:
            headcount: { type: integer, minimum: 0 }
            hires: { type: integer, minimum: 0 }
            departures: { type: integer, minimum: 0 }
            turnoverRate: { type: [number, 'null'], minimum: 0 }
        ageGroups:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string, enum: [under20, 20s, 30s, 40s, 50s, 60plus, unknown] }
              count: { type: integer, minimum: 0 }
        genders:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string, enum: [female, male, unspecified, other] }
              count: { type: integer, minimum: 0 }
        annual:
          type: array
          minItems: 1
          items:
            type: object
            required: [year, startDate, endDate, startingHeadcount, headcount, hires, departures, turnoverRate]
            properties:
              year: { type: integer }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              startingHeadcount: { type: integer, minimum: 0 }
              headcount: { type: integer, minimum: 0 }
              hires: { type: integer, minimum: 0 }
              departures: { type: integer, minimum: 0 }
              turnoverRate: { type: [number, 'null'], minimum: 0 }
    DisplayLanguage:
      type: string
      enum: [en, ja]
      minLength: 2
      maxLength: 64
      description: Supported display-language tag. Storage accepts hyphen-separated language tags; API support is restricted to this allowlist. Add a language here together with the API allowlist and frontend translation definition.
    SystemInformation:
      type: object
      required: [name, version, noticeIds, repositoryUrl, revisionHistory]
      properties:
        name: { type: string, minLength: 1, example: SME Portal Hub }
        version: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$', example: 0.2.0 }
        noticeIds:
          description: Stable message IDs resolved by the frontend release dictionaries.
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        repositoryUrl: { type: [string, 'null'], format: uri, pattern: '^https?://' }
        revisionHistory:
          type: array
          items:
            type: object
            required: [version, releasedAt, changeIds]
            properties:
              version: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$', example: 0.2.0 }
              releasedAt: { type: string, format: date, example: '2026-10-03' }
              changeIds:
                description: Ordered stable message IDs resolved by the frontend release dictionaries.
                type: array
                uniqueItems: true
                minItems: 1
                items: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
    MasterListItem:
      type: object
      required: [usageCount]
      properties:
        usageCount:
          type: integer
          minimum: 0
          description: Number of active records that directly reference this master item. Compound masters sum the active reference types documented by the application.
      additionalProperties: true
    WorkCalendarWrite:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'], maxLength: 1000 }
    WorkCalendarEntryWrite:
      type: object
      required: [workDate, entryType, title]
      properties:
        workDate: { type: string, format: date }
        entryType: { type: string, enum: [working_day, company_holiday] }
        title: { type: string, minLength: 1, maxLength: 128 }
        note: { type: [string, 'null'], maxLength: 5000 }
    ExternalLinkWrite:
      type: object
      required: [name, url, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, format: uri, maxLength: 2048, pattern: '^https?://' }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647, default: 9999 }
    BranchWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        sortOrder: { type: integer, minimum: 0, default: 9999 }
        openedOn: { type: [string, 'null'], format: date }
        closedOn: { type: [string, 'null'], format: date, description: Must not be before openedOn. A non-null value soft-deletes the branch. }
        postalCode: { type: [string, 'null'], maxLength: 8, pattern: '^\d{3}-?\d{4}$' }
        prefecture: { type: [string, 'null'], maxLength: 64 }
        city: { type: [string, 'null'], maxLength: 128 }
        streetAddress: { type: [string, 'null'], maxLength: 255 }
        buildingName: { type: [string, 'null'], maxLength: 255 }
        phoneNumber1: { type: [string, 'null'], maxLength: 32 }
        phoneNumber1Label: { type: [string, 'null'], maxLength: 128 }
        phoneNumber2: { type: [string, 'null'], maxLength: 32 }
        phoneNumber2Label: { type: [string, 'null'], maxLength: 128 }
        faxNumber1: { type: [string, 'null'], maxLength: 32 }
        faxNumber1Label: { type: [string, 'null'], maxLength: 128 }
        faxNumber2: { type: [string, 'null'], maxLength: 32 }
        faxNumber2Label: { type: [string, 'null'], maxLength: 128 }
        managerEmployeeId: { $ref: '#/components/schemas/OptionalPositiveIdInput' }
        deputyManagerEmployeeId: { $ref: '#/components/schemas/OptionalPositiveIdInput' }
        notes: { type: [string, 'null'], maxLength: 5000 }
    Role:
      type: object
      required: [id, name, isSystemManagement, createdAt, updatedAt]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 128 }
        isSystemManagement: { type: boolean, description: Server-derived assignment guard. Internal permission identifiers are never returned. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoleNameWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    EmployeeDerivedFields:
      type: object
      description: Language-neutral values calculated by the API for each employee response and never persisted.
      required: [age, lengthOfService, employmentStatus]
      properties:
        age: { type: integer, minimum: 0, description: Completed years as of the API calculation date. }
        employmentStatus: { type: string, enum: [current, retired, deleted], description: Deleted takes precedence over retired; current includes future retirement dates. }
        lengthOfService:
          type: object
          required: [years, months]
          properties:
            years: { type: integer, minimum: 0 }
            months: { type: integer, minimum: 0, maximum: 11 }
    EmployeeWrite:
      type: object
      required: [employeeCode, firstName, lastName, birthDate, gender, email, hiredAt, employmentTypeId, branchId, roleIds]
      properties:
        employeeCode: { type: string, minLength: 10, maxLength: 64, pattern: '^[A-Za-z0-9]+$', description: Must be unique among employees. }
        firstName: { type: string, maxLength: 128 }
        middleName: { type: [string, 'null'], maxLength: 128 }
        lastName: { type: string, maxLength: 128 }
        nameKana: { type: [string, 'null'], maxLength: 255 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, unspecified] }
        bloodType: { type: [string, 'null'], enum: [A, B, AB, O, null] }
        postalCode: { type: [string, 'null'], maxLength: 8, pattern: '^\d{3}-?\d{4}$' }
        prefecture: { type: [string, 'null'], maxLength: 64 }
        city: { type: [string, 'null'], maxLength: 128 }
        streetAddress: { type: [string, 'null'], maxLength: 255 }
        buildingName: { type: [string, 'null'], maxLength: 255 }
        mobilePhone: { type: [string, 'null'], maxLength: 32, pattern: '^[+0-9][0-9 ()-]{6,31}$' }
        email: { type: string, format: email, maxLength: 254, description: Must be unique among employees. }
        hiredAt: { type: string, format: date }
        departmentId: { type: [integer, 'null'], minimum: 1, deprecated: true, description: Compatibility alias for primaryDepartmentId. Use departmentIds and primaryDepartmentId for new clients. }
        departmentIds:
          type: array
          uniqueItems: true
          description: Active department identifiers. An empty array means that no department is assigned.
          items: { type: integer, minimum: 1 }
        primaryDepartmentId: { type: [integer, 'null'], minimum: 1, description: Must be included in departmentIds when departments are assigned. }
        groupId: { type: [integer, 'null'], minimum: 1, description: When provided, the group must belong to primaryDepartmentId. }
        positionId: { type: [integer, 'null'], minimum: 1, deprecated: true, description: Compatibility alias for primaryPositionId. Use positionIds and primaryPositionId for new clients. }
        positionIds:
          type: array
          uniqueItems: true
          description: Active position identifiers. An empty array means that no position is assigned.
          items: { type: integer, minimum: 1 }
        primaryPositionId: { type: [integer, 'null'], minimum: 1, description: Must be included in positionIds when positions are assigned. }
        employmentTypeId: { type: integer, minimum: 1 }
        branchId: { type: integer, minimum: 1 }
        retiredAt: { type: [string, 'null'], format: date, description: Must not be before hiredAt. }
        notes: { type: [string, 'null'], maxLength: 5000 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Active role identifiers returned by GET /v1/roles.
          items: { $ref: '#/components/schemas/PositiveIdInput' }
    PositiveIdInput:
      description: A positive database identifier. Digit strings are accepted because browser form values are serialized as strings.
      oneOf:
        - { type: integer, minimum: 1 }
        - { type: string, pattern: '^[1-9]\d*$' }
    OptionalPositiveIdInput:
      description: An optional positive identifier. Null and an empty string both mean not selected.
      oneOf:
        - $ref: '#/components/schemas/PositiveIdInput'
        - { type: 'null' }
        - { type: string, maxLength: 0 }
    ItAssetWrite:
      type: object
      required: [typeId, storageId, statusId]
      properties:
        assetTag:
          description: Management code. Null or omission requests automatic allocation. A supplied new value must match the selected type prefix followed by exactly three digits. An unchanged four-digit value is accepted only when updating a legacy IT asset. Codes previously used by active or soft-deleted assets cannot be reused.
          oneOf:
            - { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Z]{3,5}-[0-9]{3,4}$' }
            - { type: 'null' }
        typeId: { $ref: '#/components/schemas/PositiveIdInput' }
        manufacturerId: { $ref: '#/components/schemas/OptionalPositiveIdInput' }
        modelNumber: { type: [string, 'null'], maxLength: 255 }
        serialNumber:
          type: [string, 'null']
          maxLength: 255
          description: When both values are present, the manufacturerId and serialNumber combination must be unique.
        cpuTypeId:
          allOf:
            - $ref: '#/components/schemas/OptionalPositiveIdInput'
          description: Allowed only when the selected IT asset type supports a CPU.
        ramGb:
          description: Allowed only when the selected IT asset type supports RAM. Null or an empty string means unset.
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string, pattern: '^[1-9]\d*$' }
            - { type: 'null' }
            - { type: string, maxLength: 0 }
        operatingSystemId:
          allOf:
            - $ref: '#/components/schemas/OptionalPositiveIdInput'
          description: Allowed only when the selected IT asset type supports an operating system.
        loginUsername:
          type: [string, 'null']
          maxLength: 255
        ipAddress1: { type: [string, 'null'], maxLength: 45, description: Optional IPv4 or IPv6 address for the first network interface. }
        ipAddress2: { type: [string, 'null'], maxLength: 45, description: Optional IPv4 or IPv6 address for the second network interface. It must differ from ipAddress1. }
        hostname: { type: [string, 'null'], maxLength: 253 }
        adminUsername: { type: [string, 'null'], maxLength: 255 }
        managementConsoleUrl: { type: [string, 'null'], maxLength: 2048, format: uri, pattern: '^https?://' }
        managementConsoleUsername: { type: [string, 'null'], maxLength: 255 }
        credentials:
          type: object
          writeOnly: true
          description: Optional atomic credential changes. Requires asset credential write permission. Omitted credential types remain unchanged.
          additionalProperties: false
          properties:
            admin: { $ref: '#/components/schemas/AssetCredentialChange' }
            login: { $ref: '#/components/schemas/AssetCredentialChange' }
            management_console: { $ref: '#/components/schemas/AssetCredentialChange' }
        storageId: { $ref: '#/components/schemas/PositiveIdInput' }
        statusId: { $ref: '#/components/schemas/PositiveIdInput' }
        purchasedOn:
          description: Optional purchase date. Null or an empty string means unset.
          oneOf:
            - { type: string, format: date }
            - { type: 'null' }
            - { type: string, maxLength: 0 }
        disposalOn:
          description: Required, optional, or prohibited according to the selected status. When present, it must not be before purchasedOn. Null or an empty string means unset.
          oneOf:
            - { type: string, format: date }
            - { type: 'null' }
            - { type: string, maxLength: 0 }
        notes: { type: [string, 'null'], maxLength: 5000 }
    AssetCredentialChange:
      oneOf:
        - type: object
          required: [action, password]
          additionalProperties: false
          properties:
            action: { const: set }
            password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        - type: object
          required: [action]
          additionalProperties: false
          properties:
            action: { const: clear }
    SuccessEnvelope:
      type: object
      required: [status, responseCode, data]
      properties:
        status: { const: success }
        responseCode: { type: integer }
        data: {}
    ListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [meta]
          properties:
            data: { type: array, items: {} }
            meta:
              type: object
              required: [offset, limit, returned, total, hasMore, sort]
              properties:
                offset: { type: integer, minimum: 0 }
                limit: { type: integer, minimum: 1, maximum: 500 }
                returned: { type: integer, minimum: 0 }
                total: { type: integer, minimum: 0 }
                hasMore: { type: boolean }
                calculatedAsOf: { type: string, format: date, description: Present for Employee lists; the business date used for derived values and sorting. }
                sort:
                  type: object
                  required: [field, order]
                  properties:
                    field: { type: string }
                    order: { type: string, enum: [asc, desc] }
    ErrorEnvelope:
      type: object
      required: [status, responseCode, error]
      properties:
        status: { const: error }
        responseCode: { type: integer, minimum: 400, maximum: 599 }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
  pathItems:
    AssetCollection:
      get:
        tags: [Assets]
        security: [{ sessionCookie: [] }]
        parameters:
          - $ref: '#/components/parameters/Offset'
          - $ref: '#/components/parameters/Limit'
          - $ref: '#/components/parameters/SortOrder'
          - name: sortBy
            in: query
            schema: { type: string, default: assetTag }
        responses:
          '200': { $ref: '#/components/responses/ListSuccess' }
          '401': { $ref: '#/components/responses/Error' }
          '403': { $ref: '#/components/responses/Error' }
          '422': { $ref: '#/components/responses/Error' }
      post:
        tags: [Assets]
        security: [{ sessionCookie: [] }]
        requestBody: { $ref: '#/components/requestBodies/JsonResource' }
        responses:
          '201': { $ref: '#/components/responses/Created' }
          '400': { $ref: '#/components/responses/Error' }
    AssetItem:
      parameters:
        - $ref: '#/components/parameters/Id'
      patch:
        tags: [Assets]
        security: [{ sessionCookie: [] }]
        requestBody: { $ref: '#/components/requestBodies/JsonResource' }
        responses:
          '200': { $ref: '#/components/responses/Success' }
          '400': { $ref: '#/components/responses/Error' }
          '404': { $ref: '#/components/responses/Error' }
      delete:
        tags: [Assets]
        security: [{ sessionCookie: [] }]
        responses:
          '200': { $ref: '#/components/responses/Success' }
          '404': { $ref: '#/components/responses/Error' }
          '409': { $ref: '#/components/responses/Error' }
x-planned-security:
  apiKey:
    header: X-API-Key
    note: API key issuance and authorization scopes are intentionally deferred until the access matrix is approved.
