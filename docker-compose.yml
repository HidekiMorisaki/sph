name: sph-blitz

# blitz.cloud's deployment wizard reads this root file. Local Docker installation
# uses docker-compose.local.yml.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      ORIGIN: ${APP_ORIGIN}
      API_INTERNAL_ORIGIN: http://v1:3000
    expose:
      - "3000"
    depends_on:
      v1:
        condition: service_started

  v1:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ORIGIN: ${APP_ORIGIN}
      IT_ASSET_CREDENTIAL_ENCRYPTION_KEY: ${IT_ASSET_CREDENTIAL_ENCRYPTION_KEY}
    expose:
      - "3000"
    depends_on:
      migration:
        condition: service_completed_successfully

  migration:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_EMPLOYEE_CODE: ${INITIAL_ADMIN_EMPLOYEE_CODE:-}
      INITIAL_ADMIN_FIRST_NAME: ${INITIAL_ADMIN_FIRST_NAME:-}
      INITIAL_ADMIN_LAST_NAME: ${INITIAL_ADMIN_LAST_NAME:-}
      INITIAL_ADMIN_BIRTH_DATE: ${INITIAL_ADMIN_BIRTH_DATE:-}
      INITIAL_ADMIN_GENDER: ${INITIAL_ADMIN_GENDER:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_HIRED_AT: ${INITIAL_ADMIN_HIRED_AT:-}
      INITIAL_ADMIN_EMPLOYMENT_TYPE: ${INITIAL_ADMIN_EMPLOYMENT_TYPE:-}
      INITIAL_ADMIN_BRANCH: ${INITIAL_ADMIN_BRANCH:-}
      INITIAL_ADMIN_DISPLAY_LANGUAGE: ${INITIAL_ADMIN_DISPLAY_LANGUAGE:-en}
      INITIAL_ADMIN_SAMPLE_DATA: ${INITIAL_ADMIN_SAMPLE_DATA:-no}
    command: ["sh", "-c", "npm run db:deploy && npm run admin:create"]
    restart: "no"
