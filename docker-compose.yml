name: sph-blitz

# blitz.cloud's deployment wizard reads this root file. Local Docker installation
# uses docker-compose.local.yml.
# The installer sets ORIGIN, the encryption key, and initial administrator values
# on the app. blitz.cloud supplies DATABASE_URL when a managed database is connected.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      API_INTERNAL_ORIGIN: http://v1:3000
    expose:
      - "3000"
    depends_on:
      v1:
        condition: service_started

  v1:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    expose:
      - "3000"
    depends_on:
      migration:
        condition: service_completed_successfully

  migration:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    command: ["sh", "-c", "npm run db:deploy && npm run admin:create"]
    restart: "no"
